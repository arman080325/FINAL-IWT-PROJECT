<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TripBoss | Confirm Booking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Booking Form Styles -->
  <link rel="stylesheet" href="booking_form.css">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="container flex">
      <a href="../HTML/home.html" class="site-brand">Trip<span class="logo-highlight">Boss</span></a>
      <button type="button" id="navbar-show-btn" class="flex">
        <i class="fas fa-bars"></i>
      </button>
      <div id="navbar-collapse">
        <button type="button" id="navbar-close-btn" class="flex">
          <i class="fas fa-times"></i>
        </button>
        <ul class="navbar-nav">
          <li class="nav-item"><a href="../HTML/home.html" class="nav-link">Home</a></li>
          <li class="nav-item"><a href="../HTML/gallery.html" class="nav-link">Gallery</a></li>
          <li class="nav-item"><a href="../HTML/blog.html" class="nav-link">Blog</a></li>
          <li class="nav-item"><a href="../HTML/about.html" class="nav-link">About</a></li>
          <li class="nav-item"><a href="../HTML/contact.html" class="nav-link">Contact</a></li>

          <li class="nav-item dropdown">
            <a href="#" class="nav-link dropdown-toggle">Tools <span class="material-icons">arrow_drop_down</span></a>
            <ul class="dropdown-menu">
              <li><a href="../tools/html/cc.html">Currency Converter</a></li>
              <li><a href="../tools/html/lt.html">Language Translator</a></li>
              <li><a href="#">Coming Soon</a></li>
            </ul>
          </li>
          <li class="nav-item"><a href="../HTML/login.html" class="nav-login-btn">✈ Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="container">

    <h2 class="title">Review & Confirm Your Booking</h2>

    <!-- Booking Summary (Auto-filled via JS) -->
    <div class="booking-summary-card" id="summaryCard">
      Loading your booking details...
    </div>

    <!-- Guest Information Form -->
    <h3 class="section-title">Guest Information</h3>

    <form id="bookingForm" class="form">

      <div class="two-columns">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="fullname" required>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" required>
        </div>
      </div>

      <div class="two-columns">
        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" id="phone" required>
        </div>

        <div class="form-group">
          <label>Country</label>
          <input type="text" id="country" placeholder="India, UAE, UK..." required>
        </div>
      </div>

      <div class="form-group">
        <label>Address</label>
        <input type="text" id="address">
      </div>

      <div class="two-columns">
        <div class="form-group">
          <label>ID Proof Type</label>
          <select id="idType">
            <option value="Passport">Passport</option>
            <option value="Aadhar Card">Aadhar Card</option>
            <option value="Driving License">Driving License</option>
          </select>
        </div>

        <div class="form-group">
          <label>ID Number</label>
          <input type="text" id="idNumber" required>
        </div>
      </div>

      <div class="form-group">
        <label>Special Requests</label>
        <textarea id="special" placeholder="e.g., Sea view room, Early check-in"></textarea>
      </div>

      <button type="submit" class="confirm-btn">Confirm Booking</button>

    </form>

  </section>

  <script src="booking_form.js"></script>
</body>
</html>
