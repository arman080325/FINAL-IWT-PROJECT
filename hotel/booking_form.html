<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TripBoss | Confirm Your Booking</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>

  <!-- Your Enhanced CSS (paste the full CSS from my previous message here or link it) -->
  <link rel="stylesheet" href="booking_form.css"/>
</head>

<body>

  <!-- Subtle Navbar -->
  <nav class="navbar">
    <a href="../index.html" class="logo">Trip<span>Boss</span></a>
  </nav>

  <main class="container">

    <h1 class="title">Review & Confirm Booking</h1>

    <!-- Booking Summary Card -->
    <div class="booking-summary-card" id="summaryCard">
      <div class="loading">
        <span class="material-icons-round" style="font-size:48px;opacity:0.3;">flight_takeoff</span>
        <p>Loading your booking details...</p>
      </div>
    </div>

    <!-- Guest Information Form -->
    <section aria-labelledby="guest-info-title">
      <h2 id="guest-info-title" class="section-title">
        <span class="material-icons-round" style="font-size:28px;vertical-align:middle;margin-right:12px;">person_outline</span>
        Guest Information
      </h2>

      <form id="bookingForm" class="form" novalidate>

        <!-- Row 1 -->
        <div class="two-columns">
          <div class="form-group">
            <input type="text" id="fullname" required />
            <label for="fullname">Full Name</label>
            <span class="material-icons-round input-icon">person</span>
          </div>

          <div class="form-group">
            <input type="email" id="email" required />
            <label for="email">Email Address</label>
            <span class="material-icons-round input-icon">mail</span>
          </div>
        </div>

        <!-- Row 2 -->
        <div class="two-columns">
          <div class="form-group">
            <input type="tel" id="phone" required />
            <label for="phone">Phone Number</label>
            <span class="material-icons-round input-icon">phone</span>
          </div>

          <div class="form-group">
            <input type="text" id="country" required />
            <label for="country">Country</label>
            <span class="material-icons-round input-icon">public</span>
          </div>
        </div>

        <!-- Address -->
        <div class="form-group">
          <input type="text" id="address" />
          <label for="address">Full Address (Optional)</label>
          <span class="material-icons-round input-icon">home</span>
        </div>

        <!-- ID Proof -->
        <div class="two-columns">
          <div class="form-group">
            <select id="idType" required>
              <option value="" disabled selected></option>
              <option value="Passport">Passport</option>
              <option value="Aadhar Card">Aadhar Card</option>
              <option value="Driving License">Driving License</option>
              <option value="National ID">National ID</option>
            </select>
            <label for="idType">ID Proof Type</label>
            <span class="material-icons-round input-icon">badge</span>
          </div>

          <div class="form-group">
            <input type="text" id="idNumber" required />
            <label for="idNumber">ID Number</label>
          </div>
        </div>

        <!-- Special Requests -->
        <div class="form-group">
          <textarea id="special" rows="3" placeholder=" "></textarea>
          <label for="special">Special Requests</label>
          <span class="material-icons-round input-icon">chat_bubble</span>
        </div>

        <!-- Submit -->
        <button type="submit" class="confirm-btn">
          <span class="btn-text">Confirm & Pay Securely</span>
          <span class="material-icons-round btn-icon">lock</span>
        </button>
      </form>
    </section>

  </main>

  <!-- Tiny script for floating label "filled" state on page load (if fields are pre-filled by JS) -->
  <script>
    // Trigger floating labels if inputs are pre-filled (e.g., from localStorage or backend)
    document.querySelectorAll('.form-group input, .form-group textarea, .form-group select').forEach(field => {
      const checkFilled = () => {
        if (field.value.trim() !== '' && field.value !== null) {
          field.parentElement.classList.add('focused');
        }
      };
      field.addEventListener('input', checkFilled);
      field.addEventListener('focus', () => field.parentElement.classList.add('focused'));
      field.addEventListener('blur', () => {
        if (field.value.trim() === '') {
          field.parentElement.classList.remove('focused');
        }
      });
      checkFilled(); // on load
    });
  </script>

  <!-- Your main JS file (for populating summary, handling submit, etc.) -->
  <script src="booking_form.js"></script>
</body>
</html>
