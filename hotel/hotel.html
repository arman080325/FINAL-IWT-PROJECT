<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>TripBoss | Hotels</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <!-- Hotel Page Styles -->
  <link rel="stylesheet" href="hotel.css" />
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="../html/home.html" class="logo">Trip<span>Boss</span></a>
      <a href="../html/home.html" class="back-home">← Back to Home</a>
    </div>
  </nav>

  <!-- Hero Section -->
  <header class="hero">
    <div class="hero-overlay"></div>

    <div class="hero-content">
      <h1>Find the Best Hotels</h1>
      <p>Search handpicked stays with a premium booking experience.</p>

      <!-- Booking Form -->
      <form id="bookingForm" class="booking-form">
        <div class="form-row">

          <div class="form-group">
            <label>City</label>
            <input type="text" id="city" placeholder="e.g., Dubai, Paris, Mumbai" required />
          </div>

          <div class="form-group">
            <label>Check-in</label>
            <input type="date" id="checkin" required />
          </div>

          <div class="form-group">
            <label>Check-out</label>
            <input type="date" id="checkout" required />
          </div>

          <div class="form-group">
            <label>Guests</label>
            <input type="number" id="guests" min="1" value="2" required />
          </div>

          <div class="form-group">
            <label>Room Type</label>
            <select id="roomType">
              <option value="standard">Standard Room</option>
              <option value="deluxe">Deluxe Room</option>
              <option value="suite">Executive Suite</option>
              <option value="presidential">Presidential Suite</option>
            </select>
          </div>
        </div>

        <button type="submit" class="search-btn">Search & Update Rooms</button>
      </form>

      <!-- Booking Summary -->
      <div id="booking-summary" class="booking-summary">
        Choose your city, dates and room to see the estimated cost.
      </div>
    </div>
  </header>

  <!-- Rooms Section -->
  <main>
    <section class="rooms-section">
      <div class="section-header">
        <h2>Available Rooms</h2>
        <p>Select a room to continue to booking.</p>
      </div>

      <div id="rooms-container" class="rooms-grid"></div>
    </section>
  </main>

  <!-- Gallery Modal -->
  <div id="galleryModal" class="modal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h3 id="galleryTitle">Room Gallery</h3>
      <div id="galleryImages" class="gallery-grid"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>© <span id="year"></span> TripBoss Hotels</p>
  </footer>


  <!-- JS -->
  <script src="hotel.js"></script>
</body>

</html>
